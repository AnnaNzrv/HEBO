[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rducb"
version = "0.1.0"
description = "Standalone packaging of RDUCB from Huawei HEBO for research reuse."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Anna" }]
keywords = ["rducb", "bayesian-optimization", "hebo", "ucb"]
requires-python = ">=3.8,<3.9"

dependencies = [
  "networkx==2.4",
  "numpy==1.18.5",
  "scipy==1.4.1",
  "matplotlib==3.2.2",
  "psutil==5.7.0",
  "h5py==2.10.0",
  "gpy==1.9.9",
  "gpyopt==1.2.6",
  "mlflow==1.9.1",
  "scikit-learn==0.23.2",
  "cma",
  "celery",
  "pyyaml",
  "ruamel.yaml",
  "coloredlogs",
  "imageio",
  "ConfigSpace==0.6.1"
]

[project.optional-dependencies]
boto = [
  "boto3==1.14.14"
]

[tool.setuptools.packages.find]
include = ["rducb*"]